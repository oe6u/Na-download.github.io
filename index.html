<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمل الفيديوهات الاحترافي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#050505] text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl bg-[#0a0a0a] border border-neutral-800 p-8 rounded-3xl glow-effect shadow-2xl">
        
        <!-- شارة العنوان -->
        <div class="text-center mb-8">
            <span class="inline-block bg-cyan-950/60 border border-cyan-800/50 text-cyan-400 text-xs px-3 py-1.5 rounded-full mb-3 font-medium">
                ⚡ مدعوم بأحدث محركات التحميل
            </span>
            <h1 class="text-3xl font-black tracking-tight text-white">تحميل فيديوهات يوتيوب وتيك توك</h1>
            <p class="text-xs text-neutral-400 mt-2">قم بلصق الرابط أدناه لتحميل الفيديوهات بأعلى جودة وبدون علامات مائية.</p>
        </div>
        
        <!-- حقل الإدخال -->
        <div class="space-y-4">
            <div class="relative">
                <input type="url" id="urlInput" placeholder="أدخل رابط يوتيوب أو تيك توك هنا..." 
                    class="w-full bg-[#121212] border border-neutral-800 px-4 py-4 rounded-2xl focus:outline-none focus:border-cyan-500 text-sm placeholder-neutral-600 text-white transition">
            </div>
            <button onclick="fetchVideo()" id="submitBtn"
                class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white py-4 rounded-2xl font-bold transition shadow-lg shadow-cyan-940/30 cursor-pointer">
                استخراج روابط التحميل
            </button>
        </div>

        <!-- حالة التحميل -->
        <div id="loading" class="hidden text-center my-6 text-cyan-400 text-sm animate-pulse">
            جاري جلب معلومات الفيديو والمعالجة...
        </div>

        <!-- صندوق النتائج -->
        <div id="resultBox" class="hidden mt-6 border-t border-neutral-800 pt-6 space-y-4">
            <div class="bg-[#121212] p-4 rounded-2xl border border-neutral-800 flex flex-col gap-3">
                <h3 id="videoTitle" class="font-semibold text-sm text-neutral-200 line-clamp-2"></h3>
                <div id="linksContainer">
                    <!-- سيتم حقن زر التحميل هنا برمجياً -->
                </div>
            </div>
        </div>

        <!-- رسالة الخطأ -->
        <div id="errorMsg" class="hidden mt-4 p-4 rounded-xl bg-red-950/40 border border-red-900/50 text-red-400 text-xs text-center"></div>
    </div>

    <footer class="mt-8 text-neutral-600 text-xs">
        جميع الحقوق محفوظة © 2026
    </footer>

    <script>
        async function fetchVideo() {
            const url = document.getElementById('urlInput').value.trim();
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('resultBox');
            const errorMsg = document.getElementById('errorMsg');
            const linksContainer = document.getElementById('linksContainer');
            const videoTitle = document.getElementById('videoTitle');

            if (!url) {
                alert('الرجاء إدخال رابط صحيح');
                return;
            }

            loading.classList.remove('hidden');
            resultBox.classList.add('hidden');
            errorMsg.classList.add('hidden');

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (response.ok && (data.status === 'redirect' || data.status === 'stream' || data.status === 'picker')) {
                    videoTitle.textContent = data.filename || 'فيديو جاهز للتحميل';
                    
                    let downloadUrl = data.url;
                    if (data.status === 'picker' && data.picker && data.picker.length > 0) {
                        downloadUrl = data.picker[0].url;
                    }

                    if (downloadUrl) {
                        linksContainer.innerHTML = `
                            <a href="${downloadUrl}" target="_blank"
                                class="block text-center bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl text-sm font-bold transition shadow-lg shadow-emerald-950/50">
                                📥 تحميل الفيديو الآن بأعلى جودة
                            </a>
                        `;
                        resultBox.classList.remove('hidden');
                    } else {
                        throw new Error('لم يتم العثور على رابط تحميل مباشر لهذا الفيديو.');
                    }
                } else {
                    throw new Error(data.text || data.error || 'حدث خطأ أثناء معالجة الرابط، تأكد أنه عام وصحيح.');
                }
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
