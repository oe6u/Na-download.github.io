<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع تحميل الفيديوهات | شغال 100%</title>
    <!-- استخدام Tailwind CSS للتصميم السريع والجميل -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-v-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-lg bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">تحميل من يوتيوب وتيك توك</h1>
            <p class="text-xs text-slate-400 mt-1">سريع، مجاني، ويعمل مباشرة من المتصفح</p>
        </div>
        
        <!-- حقل إدخال الرابط -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-2">أدخل رابط الفيديو (يوتيوب / تيك توك):</label>
                <input type="url" id="urlInput" placeholder="https://www.tiktok.com/... أو https://youtu.be/..." 
                    class="w-full bg-slate-800 border border-slate-700 px-4 py-3 rounded-xl focus:outline-none focus:border-cyan-500 text-sm placeholder-slate-500">
            </div>
            <button onclick="generateLinks()" id="downloadBtn"
                class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 py-3 rounded-xl font-bold transition shadow-lg shadow-cyan-500/20 cursor-pointer">
                الحصول على روابط التحميل
            </button>
        </div>

        <!-- منطقة النتيجة -->
        <div id="resultBox" class="hidden mt-6 border-t border-slate-800 pt-6 space-y-4">
            <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50 flex flex-col gap-3">
                <h3 id="videoTitle" class="font-semibold text-sm text-slate-200 line-clamp-2"></h3>
                <div class="flex flex-col gap-2">
                    <a id="downloadLinkDirect" href="#" target="_blank"
                        class="block text-center bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-lg text-sm font-semibold transition">
                        📥 تحميل الفيديو (بدون علامة مائية / أعلى جودة)
                    </a>
                </div>
            </div>
        </div>

        <!-- رسالة الخطأ أو التحميل -->
        <div id="statusMsg" class="hidden mt-4 text-center text-xs text-amber-400"></div>
    </div>

    <footer class="mt-8 text-slate-600 text-xs">
        مُشغل بواسطة GitHub Pages & Cobalt API
    </footer>

    <script>
        async function generateLinks() {
            const url = document.getElementById('urlInput').value.trim();
            const statusMsg = document.getElementById('statusMsg');
            const resultBox = document.getElementById('resultBox');
            const downloadLinkDirect = document.getElementById('downloadLinkDirect');
            const videoTitle = document.getElementById('videoTitle');

            if (!url) {
                alert('الرجاء إدخال رابط صالح أولاً');
                return;
            }

            statusMsg.classList.remove('hidden');
            statusMsg.textContent = 'جاري معالجة الرابط وجلب روابط التحميل...';
            resultBox.classList.add('hidden');

            try {
                // استخدام خدمة Cobalt API المجانية والمستقرة للتحميل بدون سيرفر خاص
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: url,
                        vQuality: 'max',
                        filenamePattern: 'classic'
                    })
                });

                const data = await response.json();

                if (data.status === 'redirect' || data.status === 'stream' || data.status === 'picker') {
                    const downloadUrl = data.url || (data.picker && data.picker[0].url);
                    
                    if (downloadUrl) {
                        downloadLinkDirect.href = downloadUrl;
                        videoTitle.textContent = data.filename || 'فيديو جاهز للتحميل';
                        resultBox.classList.remove('hidden');
                        statusMsg.classList.add('hidden');
                    } else {
                        throw new Error('لم يتم العثور على رابط التحميل');
                    }
                } else {
                    throw new Error(data.text || 'حدث خطأ أثناء معالجة الرابط، تأكد أنه عام وصحيح.');
                }
            } catch (error) {
                statusMsg.textContent = 'خطأ: ' + error.message;
                statusMsg.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
